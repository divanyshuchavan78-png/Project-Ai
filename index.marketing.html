<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Marketing Cloud - Student Project</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.7.0/fonts/remixicon.css" rel="stylesheet" />
    <style>
        body { font-family: sans-serif; margin: 0; padding: 0; }
        .hero {
            background-image: linear-gradient(to bottom right, #ff5a5f, #ffb400);
            color: white;
            padding: 80px 20px;
            text-align: center;
        }
        .content { padding: 40px; }
        .campaign-grid {
            display: flex;
            gap: 20px;
            justify-content: center;
        }
        .camp-box {
            border: 1px solid #ddd;
            padding: 20px;
            width: 200px;
            border-radius: 8px;
        }
        .camp-box h4 { margin-bottom: 5px; }
    </style>
</head>
<body>

    <div class="hero">
        <h1>Marketing Campaign Center</h1>
        <p>Reaching the right customers at the right time.</p>
        <a href="index.html" style="color: white;">Back to Main Site</a>
    </div>

    <div class="content">
        <h2>Active Campaigns</h2>
        <div class="campaign-grid">
            <div class="camp-box">
                <i class="ri-mail-send-line" style="font-size: 30px; color: #ff5a5f;"></i>
                <h4>Email Blast</h4>
                <p>Sent to 5,000 users.</p>
            </div>
            <div class="camp-box">
                <i class="ri-instagram-line" style="font-size: 30px; color: #ff5a5f;"></i>
                <h4>Social Ads</h4>
                <p>350 clicks today.</p>
            </div>
            <div class="camp-box">
                <i class="ri-calendar-event-line" style="font-size: 30px; color: #ff5a5f;"></i>
                <h4>Summer Sale</h4>
                <p>Starts in 2 days.</p>
            </div>
        </div>
    </div>

</body>
</html>
