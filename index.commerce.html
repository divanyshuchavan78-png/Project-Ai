<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Commerce Cloud - Student Project</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.7.0/fonts/remixicon.css" rel="stylesheet" />
    <style>
        body {
            
            font-family: 'Arial', sans-serif;
           background: #f4f4f4; margin: 0; 
    }
        .top-bar { 
            background: #032d60;
             color: white; 
            padding: 10px 50px; }
        .shop-container { 
            padding: 40px; 
            display: flex; 
            flex-wrap: wrap; 
            gap: 30px;
            justify-content: center; }
        .product { 
            background: white; 
            width: 250px; 
            padding: 20px; 
            border-radius: 10px;
             text-align: center;
             }
        .product img { 
            width: 100%;
             border-radius: 5px; 
             margin-bottom: 10px; }
        .price { 
            color: #2e844a;
             font-weight: bold; 
             font-size: 18px; }
        .buy-btn { 
            background: #00a1e0; 
            color: white; padding: 8px 15px;
             border-radius: 5px; 
             border: none;
            cursor: pointer; }
    </style>
</head>
<body>

    <div class="top-bar">
        <span><b>Student Store (Commerce Cloud Demo)</b></span>
        <a href="index.html" style="float: right; color: white; text-decoration: none;">Home</a>
    </div>

    <div class="shop-container">
        <div class="product">
            <img src="https://via.placeholder.com/150" alt="Product 1">
            <h3>Enterprise CRM</h3>
            <p>Annual Subscription</p>
            <p class="price">$1,200</p>
            <button class="buy-btn">Add to Cart</button>
        </div>
        <div class="product">
            <img src="https://via.placeholder.com/150" alt="Product 2">
            <h3>Analytics Plugin</h3>
            <p>One-time setup</p>
            <p class="price">$450</p>
            <button class="buy-btn">Add to Cart</button>
        </div>
    </div>

</body>
</html>
